<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' blob:;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartScreen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="overlay"></div>
  <div id="pixelateLayer"><canvas id="pixelateCanvas" width="1" height="1"></canvas></div>
  <div id="blackoutLayer"></div>
  <div id="focusLayer"></div>
  <div id="vignetteLayer"></div>

  <div id="control">
    <div id="panelHeader">
      <button id="miniToggle" type="button" aria-label="Toggle control panel">≡</button>
      <div class="brand-block">
        <div class="panel-title">SmartScreen</div>
        <div id="deviceStatus">Local privacy protection</div>
      </div>
    </div>

    <div class="live-status" aria-live="polite">
      <div class="status-card">
        <span class="section-label">PROTECTION</span>
        <span id="ai-status">Inactive</span>
      </div>
      <div class="status-card">
        <span class="section-label">IDENTITY</span>
        <span id="identity-live">Not monitored</span>
      </div>
    </div>

    <div class="gate-row">
      <span id="gate-status" aria-live="polite">Presence Gate ready</span>
      <button id="gateBtn" type="button" aria-pressed="true" title="Hide the screen unless the owner is verified">Presence Gate</button>
    </div>

    <div id="panelBody">
      <div class="section-label section-heading">EFFECTS</div>
      <div class="action-grid">
        <button id="blurBtn" type="button">Blur</button>
        <button id="pixelateBtn" type="button">Pixelate</button>
        <button id="blackoutBtn" type="button">Blackout</button>
        <button id="effectsBtn" type="button" aria-expanded="false">Effects</button>
      </div>

      <div id="effectsPanel" class="effects-panel" hidden>
        <div class="effect-row">
          <div>
            <span class="effect-name">Focus</span>
            <span class="effect-value" id="focusValue">Off</span>
          </div>
          <button id="focusBtn" class="mini-effect" type="button">Toggle</button>
        </div>
        <div class="effect-row">
          <div>
            <span class="effect-name">Vignette</span>
            <span class="effect-value" id="vignetteValue">Off</span>
          </div>
          <button id="vignetteBtn" class="mini-effect" type="button">Toggle</button>
        </div>
        <div class="effect-control">
          <div class="effect-control-head"><span>Privacy intensity</span><span id="intensityValue">50</span></div>
          <input id="intensitySlider" type="range" min="0" max="100" step="1" value="50" aria-label="Privacy intensity">
        </div>
      </div>

      <button id="retryBtn" class="retry-action" type="button" hidden>Retry</button>
      <button id="aiBtn" class="primary-action" type="button">Enable Protection</button>
    </div>

    <div class="event-row">
      <div class="section-label">LAST EVENT</div>
      <div id="eventList" class="event-list" aria-live="polite"></div>
    </div>

    <button id="identityBtn" class="identity-action" type="button">Enroll Owner</button>
  </div>

  <div id="aiWarning">Privacy protection triggered</div>
  <script src="privacy_state.js"></script>
  <script src="intensity.js"></script>
  <script src="overlay_effects.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
